<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A general website checker for users facing internet restrictions." />
    <title>NodeLook</title>
    <link rel="mask-icon" href="https://nodelook.github.io/assets/pinned.svg" color="#000000" />
    <link rel="alternate icon" type="image/png" href="https://nodelook.github.io/assets/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="https://nodelook.github.io/assets/favicon.svg" />
    <meta name="theme-color" content="#1e2327" />
    <meta name="color-scheme" content="light dark" />
  </head>
    <script>
        const lang = navigator.language.toLowerCase();
        if (lang.startsWith("fa")) {
            location.replace("fa/");
        } else if (lang.startsWith("cn")) {
            location.replace("cn/");
        } else {
            location.replace("en/");
        }
    </script>
</head>

<body>
    Redirecting...
</body>

</html>
