<!DOCTYPE html>
<html>
<head>
<script>
const lang = navigator.language.toLowerCase();
if (lang.startsWith("fa")) {
    location.replace("fa/");
} else if (lang.startsWith("cn")) {
    location.replace("cn/");
} else {
    location.replace("en/");
}
</script>
</head>

</html>
