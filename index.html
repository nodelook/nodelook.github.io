<!doctype html>
<html lang="en" dir="ltr">

<head>
  <title>NodeLook</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A general website checker for users facing internet restrictions." />
  <meta name="theme-color" content="#1e2327" />
  <meta name="color-scheme" content="light dark" />
  <meta name="google" content="notranslate" />
  <link rel="mask-icon" href="./images/pinned.svg" color="#000000" />
  <link rel="alternate icon" type="image/png" href="./images/favicon.png" />
  <link rel="icon" type="image/svg+xml" href="./images/favicon.svg" />
  <link rel="alternate" type="application/atom+xml" title="NodeLook" href="./en/feed.rss" />
  <link rel="canonical" href="https://nodelook.github.io/" />
  <link rel="stylesheet" href="./css/background.css">
</head>

<script>
  const lang = navigator.language.toLowerCase();
  if (lang.startsWith("fa")) {
    location.replace("./fa/index.html");
  } else {
    location.replace("./en/index.html");
  }
</script>
</head>

<body>
  <a href="./en/index.html">English</a>
  <a href="./fa/index.html">فارسی</a>
</body>

</html>
